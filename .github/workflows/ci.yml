name: contracts-ci

# Compila y prueba los contratos Soroban del workspace backend/contracts.

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32v1-none

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend/contracts

      - name: Format check
        working-directory: backend/contracts
        run: cargo fmt --all --check

      # soroban-sdk 28 solo compila a Wasm con `stellar contract build`.
      - name: Install Stellar CLI
        uses: stellar/stellar-cli@v28.1.0

      # Va antes de los tests: los de upgrade incluyen estos Wasm.
      - name: Build wasm release
        working-directory: backend/contracts
        run: stellar contract build

      - name: Clippy
        working-directory: backend/contracts
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Unit tests
        working-directory: backend/contracts
        run: cargo test --workspace
