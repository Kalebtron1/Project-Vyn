[package]
name = "vinculo_lending"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }
stellar-access = { workspace = true }
stellar-contract-utils = { workspace = true }
stellar-macros = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
# Solo en tests: como dependencia normal exportaría sus funciones en este Wasm.
staking_pool = { path = "../staking_pool" }
vinculo_sbt = { path = "../vinculo_sbt" }
